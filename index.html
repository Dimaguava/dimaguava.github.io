
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АЛЕКСАНДРА БАНАКИНА | KAKYAORU</title>
    <style>
        /* Рваный минимализм и уличный стиль */
        @import url('https://googleapis.com');

        :root {
            --bg-color: #0d0d0d;
            --text-color: #f2f2f2;
            --accent-color: #ff003c; /* Уличный баллончик */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }

        /* Текстура шума/сырости поверх сайта */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0.04;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://w3.org id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Хедер */
        header {
            padding: 40px 20px;
            border-bottom: 5px solid var(--text-color);
            position: relative;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 6rem);
            text-transform: uppercase;
            line-height: 0.9;
            letter-spacing: -2px;
            word-wrap: break-word;
        }

        .stencil {
            font-family: 'Special Elite', monospace;
            color: var(--accent-color);
            display: block;
            font-size: 0.4em;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        /* Сетка галереи */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 0px;
            border-bottom: 5px solid var(--text-color);
        }

        .gallery-item {
            position: relative;
            border: 2px solid var(--bg-color);
            overflow: hidden;
            background: #1a1a1a;
            aspect-ratio: 1 / 1;
        }

        /* Эффект рваного края при наведении */
        .gallery-item::after {
            content: '';
            position: absolute;
            inset: 0;
            border: 10px solid transparent;
            transition: all 0.2s ease;
            pointer-events: none;
        }

        .gallery-item:hover::after {
            border-color: var(--accent-color);
            clip-path: polygon(0% 0%, 100% 0%, 95% 45%, 100% 100%, 50% 95%, 0% 100%, 5% 50%);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(120%);
            transition: all 0.3s ease;
        }

        .gallery-item:hover img {
            filter: grayscale(0%) contrast(100%);
            transform: scale(1.03);
        }

        .manifesto {
            padding: 80px 20px;
            max-width: 800px;
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            text-transform: uppercase;
            font-weight: 900;
            line-height: 1.1;
        }

        .manifesto p {
            margin-bottom: 40px;
            position: relative;
        }

        .highlight {
            background: var(--text-color);
            color: var(--bg-color);
            padding: 0 10px;
            display: inline-block;
            transform: rotate(-1deg);
        }

        /* Футер / Контакты */
        footer {
            padding: 40px 20px;
            background: var(--text-color);
            color: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        footer a {
            color: var(--bg-color);
            font-size: 1.5rem;
            text-transform: uppercase;
            text-decoration: none;
            font-weight: 900;
            border-bottom: 3px solid var(--bg-color);
            width: fit-content;
        }

        footer a:hover {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        .raw-label {
            font-family: 'Special Elite', monospace;
            font-size: 1rem;
            align-self: flex-end;
        }

        /* Адаптивность для мобилок */
        @media (max-width: 600px) {
            header { padding: 20px 10px; }
            .manifesto { padding: 40px 10px; }
            footer { padding: 30px 10px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Александра  KAK YA<br>Банакина  ORU</h1>
        <span class="stencil">СЫРОЕ МЕДИА // УЛИЧНЫЙ СТИЛЬ // ФОТОГРАФИЯ</span>
    </header>

    <main>
        <!-- Сетка с фото. Замените src на свои файлы -->
        <section class="gallery">
            <div class="gallery-item">
                <img src="image1.jpg" alt="Александр Банакин — Работа 1">
            </div>
            <div class="gallery-item">
                <img src="image2.jpg" alt="Александр Банакин — Работа 2">
            </div>
            <div class="gallery-item">
                <img src="image3.jpg" alt="Александр Банакин — Работа 3">
            </div>
            <div class="gallery-item">
                <img src="image4.jpg" alt="Александра Банакина — Работа 4">
            </div>
            <div class="gallery-item">
                <img src="image5.jpg" alt="Александра Банакина — Работа 5">
            </div>
            <div class="gallery-item">
                <img src="image6.jpg" alt="Александра Банакина — Работа 6">
            </div>
        </section>

        <!-- Текст манифеста в рваном стиле -->
        <section class="manifesto">
            <p>Я ору через <span class="highlight">объектив</span>.</p>
            <p>Стены помнят всё. Текстуры города не врут. Никакого глянца — только чистая, грязная реальность.</p>
        </section>
    </main>

    <footer>
        <a href="mailto:banakin.art@example.com">БРОСИТЬ ВЫЗОВ / EMAIL</a>
        <a href="https://instagram.com" target="_blank">INSTAGRAM</a>
        <span class="raw-label">© 2026 BANAKINA. RAW MEDIA ONLY.</span>
    </footer>

</body>
</html>
